services:
  db:
    image: postgres:15-alpine
    container_name: codemix_postgres_container
    environment:
      POSTGRES_DB: codemix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    networks:
      - red_api
    volumes:
      - pgdata_camuad:/var/lib/postgresql/data
 

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: codemix_pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@codemix.com
      PGADMIN_DEFAULT_PASSWORD: 1234
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - red_api
 
volumes:
  pgdata_camuad:
 
networks:
  red_api:
    driver: bridge